<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Third-party service enquiries | Holicon Energy</title><style>body{margin:0;background:#101315;color:white;font:16px/1.6 Arial,sans-serif}main{max-width:700px;margin:60px auto;padding:25px}a{color:#9ce51a}input,textarea,select{display:block;width:100%;padding:12px;margin:5px 0 18px;background:#1a2020;color:white;border:1px solid #657268;border-radius:6px;box-sizing:border-box}label{font-weight:bold}button{background:#9ce51a;padding:13px 20px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.note{background:#263024;padding:15px;margin:20px 0}</style></head><body><main><a href="/customer-care/">← Customer Care</a><h1>Third-party service enquiries</h1><p>Our existing Holicon customers receive priority support. We may be able to assist with installations carried out by other companies, subject to availability and a quotation for any chargeable work.</p><form id="form"><label>Name *<input name="name" required></label><label>Email *<input name="email" type="email" required></label><label>Phone *<input name="phone" type="tel" required></label><label>Site address *<input name="address" required></label><label>Postcode *<input name="postcode2" required></label><label>Manufacturer *<select name="manufacturer" required><option value="">Select</option><option>Growatt</option><option>SolaX</option><option>GivEnergy</option><option>Sigenergy</option><option>Fox ESS</option><option>Tesla</option><option>EcoFlow</option><option>Other / Unsure</option></select></label><label>Issue *<select name="issue" required><option value="">Select</option><option>Wi-Fi / monitoring</option><option>System fault</option><option>Battery issue</option><option>Solar generation concern</option><option>EV charger</option><option>Other</option></select></label><label>Describe the issue *<textarea name="details" required rows="4"></textarea></label><div class="note"><label><input type="checkbox" name="charges" required style="display:inline;width:auto"> I understand that any service may be chargeable and subject to availability.</label><br><label><input type="checkbox" name="consent" required style="display:inline;width:auto"> I agree to Holicon contacting me about this request.</label></div><button type="submit" id="send">Submit service enquiry</button><p id="status" role="status"></p></form></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const details=Object.fromEntries(new FormData(f));details.installer='Another installer';details.charges=true;details.consent=true;const fd=new FormData();fd.append('mode','third-party');fd.append('details',JSON.stringify(details));const b=document.getElementById('send'),s=document.getElementById('status');b.disabled=true;s.textContent='Sending…';try{const r=await fetch('/api/enquiry',{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to send');f.reset();s.textContent='Thank you. Your request has been received. Reference: '+j.reference;}catch(err){s.textContent=err.message+' Please email admin@holiconenergy.co.uk.'}finally{b.disabled=false}});</script></body></html>
