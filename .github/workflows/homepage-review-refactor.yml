name: Optimise Holicon homepage on review branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/homepage-review-refactor.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/homepage-assets
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract existing homepage assets
        run: python3 scripts/optimise_homepage.py
      - name: Verify asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          paths = re.findall(r'(?:src|href)=[\"\'](assets/homepage/[^\'\"]+)[\"\']', html)
          missing = [p for p in paths if not Path(p).is_file()]
          assert not missing, f'Missing assets: {missing[:15]}'
          assert 'Start Your Enquiry' in html
          print(f'Validated {len(paths)} extracted asset references')
          PY
      - name: Commit results only to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/homepage/
          if ! git diff --cached --quiet; then
            git commit -m "Extract embedded assets from homepage and update enquiry CTA"
            git push origin HEAD:refactor/homepage-assets
          fi
